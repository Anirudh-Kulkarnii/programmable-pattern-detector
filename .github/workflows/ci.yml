name: ASIC Verification CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  simulate:
    name: RTL Functional Simulation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Simulation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Prepare Simulation Directories
        run: |
          mkdir -p sim

      - name: Run Behavioral RTL Simulation
        run: |
          iverilog -g2012 -o sim/sim_rtl rtl/pattern_detector.v tb/tb_pattern_detector.v
          vvp sim/sim_rtl
