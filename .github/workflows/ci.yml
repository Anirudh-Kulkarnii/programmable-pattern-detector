name: ASIC Verification CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  simulate:
    name: RTL & Gate-Level Simulation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Simulation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Prepare Simulation Output Directory
        run: |
          mkdir -p sim/build

      - name: Run Behavioral RTL Simulation
        run: |
          iverilog -g2012 -o sim/build/sim_rtl rtl/pattern_detector.v tb/tb_pattern_detector.v
          vvp sim/build/sim_rtl

      - name: Run Post-Layout Gate-Level Simulation (GLS)
        run: |
          iverilog -g2012 -DFUNCTIONAL -DUSE_POWER_PINS -DUNIT_DELAY=#1 \
            -o sim/build/sim_gls \
            sim/models/primitives.v \
            sim/models/sky130_fd_sc_hd.v \
            openlane/pattern_detector/runs/hardening_run/results/final/verilog/gl/pattern_detector.v \
            tb/tb_pattern_detector_gls.v
          vvp sim/build/sim_gls
