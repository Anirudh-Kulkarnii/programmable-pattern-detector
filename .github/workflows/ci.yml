name: ASIC Verification CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  simulate:
    name: RTL & Gate-Level Simulation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Simulation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Run Behavioral RTL Simulation
        run: |
          iverilog -g2012 -o sim_rtl rtl/pattern_detector.v tb/tb_pattern_detector.v
          vvp sim_rtl

      - name: Download Sky130 Primitives for GLS
        run: |
          mkdir -p sky130_models
          curl -s https://raw.githubusercontent.com/google/skywater-pdk-libs-sky130_fd_sc_hd/master/cells/primitives.v -o sky130_models/primitives.v
          curl -s https://raw.githubusercontent.com/google/skywater-pdk-libs-sky130_fd_sc_hd/master/cells/sky130_fd_sc_hd.v -o sky130_models/sky130_fd_sc_hd.v

      - name: Run Post-Layout Gate-Level Simulation (GLS)
        run: |
          iverilog -g2012 -DFUNCTIONAL -DUSE_POWER_PINS -DUNIT_DELAY=#1 \
            -o sim_gls \
            sky130_models/primitives.v \
            sky130_models/sky130_fd_sc_hd.v \
            openlane/pattern_detector/runs/hardening_run/results/final/verilog/gl/pattern_detector.v \
            tb/tb_pattern_detector_gls.v
          vvp sim_gls
